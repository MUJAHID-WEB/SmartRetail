version: '3.8'

services:
  customer-service:
    build: ./services/customer-service
    ports:
      - "5000:5000"
    volumes:
      - ./ml-models:/ml-models  # PROBLEM: Direct model mount
      - ./data-pipelines:/data-pipelines

  pricing-service:
    build: ./services/pricing-service
    ports:
      - "5007:5007"
    volumes:
      - ./ml-models:/ml-models
      - ./data-pipelines:/data-pipelines
